<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>玫红色视频播放按钮 | 学号:25051060112</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
         }
         body {
             background: linear-gradient(180deg, #6b2a5e 0%, #c75b9a 100%);
             min-height: 100vh;
             display: flex;
             justify-content: center;
             align-items: center;
             padding: 20px;
         }
         .video-button {
             width: 220px;
             height: 220px;
             background: linear-gradient(145deg, #b84a8c, #7a2e66);
             border-radius: 24px;
             box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
             display: flex;
             justify-content: center;
             align-items: center;
             cursor: pointer;
             transition: transform 0.2s ease;
         }
         .video-button:hover {
             transform: translateY(-4px);
         }
         .screen-frame {
             width: 160px;
             height: 120px;
             background: #2d1628;
             border-radius: 12px;
             display: flex;
             justify-content: center;
             align-items: center;
             padding: 8px;
         }
         .screen-content {
             width: 100%;
             height: 100%;
             background: linear-gradient(135deg, #ff99b4 0%, #c94c8c 100%);
             border-radius: 6px;
             display: flex;
             justify-content: center;
             align-items: center;
         }
         .play-circle {
             width: 70px;
             height: 70px;
             background: #ffffff;
             border-radius: 50%;
             display: flex;
             justify-content: center;
             align-items: center;
         }
         /* 播放三角形 */
         .play-triangle {
             width: 0;
             height: 0;
             border-top: 16px solid transparent;
             border-bottom: 16px solid transparent;
             border-left: 26px solid #2d1628;
         }
     </style>
 </head>
 <body>
     <div class="video-button">
         <div class="screen-frame">
             <div class="screen-content">
                 <div class="play-circle">
                     <div class="play-triangle"></div>
                 </div>
             </div>
         </div>
     </div>
 </body>
 </html>
